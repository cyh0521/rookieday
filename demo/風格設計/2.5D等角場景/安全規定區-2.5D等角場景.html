<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>安全規定區 · 2.5D 等角場景</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20261f;color:#e9e3ce;font-family:"Microsoft JhengHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(1180px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 4px 18px}h1{font-size:21px;letter-spacing:.14em;margin:0}header p{margin:7px 0 0;color:#a9b39c;font-size:12px;letter-spacing:.08em}.badge{font-size:12px;color:#d8c17e;border:1px solid #6a6344;padding:9px 15px;border-radius:4px}figure{margin:0;background:#394334;border:1px solid #667053;box-shadow:0 24px 60px #0005;position:relative}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}footer{display:flex;justify-content:space-between;align-items:start;gap:16px;padding:16px 4px;color:#aab29e;font-size:12px;line-height:1.8}details{text-align:right}summary{cursor:pointer;color:#d8c17e}fieldset{border:1px solid #56614a;padding:12px;margin-top:10px;display:flex;gap:15px;flex-wrap:wrap}label{white-space:nowrap;cursor:pointer}input{accent-color:#c5af69}button{color:#e9e3ce;background:#36412f;border:1px solid #657251;padding:6px 12px;cursor:pointer;font:inherit}button:hover{background:#46543b}@media(max-width:600px){body{padding:8px}header{padding:10px 2px}h1{font-size:17px}.badge{font-size:10px;padding:6px}footer{flex-direction:column}details{text-align:left}}
</style>
</head>
<body><main>
<header><div><h1>安全規定區</h1><p>靶場見習日 · 行前集合</p></div><span class="badge">01 ／ 場地導覽</span></header>
<figure><canvas id="scene" width="960" height="680" aria-label="由獨立像素元素組成的等角安全規定區：石牆、告示牌、裝備桌、教官和四位學員。">您的瀏覽器需要支援 Canvas 才能顯示場景。</canvas></figure>
<footer><span>聽從指示 · 依序集合 · 確認裝備</span><details><summary>場景圖層</summary><fieldset><label><input type="checkbox" data-layer="people" checked>人物</label><label><input type="checkbox" data-layer="equipment" checked>桌椅與裝備</label><label><input type="checkbox" data-layer="greenery" checked>樹木植栽</label><label><input type="checkbox" data-layer="board" checked>告示牌</label><button id="save" type="button">儲存場景 PNG</button></fieldset></details></footer>
</main>
<script>
'use strict';
// Every object is drawn independently. No external image, library or animation loop.
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const layers={people:true,equipment:true,greenery:true,board:true};
const W=37,H=18.5,OX=459,OY=184;
const iso=(x,y,z=0)=>[Math.round(OX+(x-y)*W),Math.round(OY+(x+y)*H-z)];
let seed=716;
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function poly(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(Math.round(p[0]),Math.round(p[1])):ctx.moveTo(Math.round(p[0]),Math.round(p[1])));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
function line(points,color,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(Math.round(p[0]),Math.round(p[1])):ctx.moveTo(Math.round(p[0]),Math.round(p[1])));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='miter';ctx.stroke();}
function plane(x,y,w,d,z,color,stroke){poly([iso(x,y,z),iso(x+w,y,z),iso(x+w,y+d,z),iso(x,y+d,z)],color,stroke);}
function box(x,y,w,d,z,height,colors){poly([iso(x,y+d,z),iso(x+w,y+d,z),iso(x+w,y+d,z+height),iso(x,y+d,z+height)],colors[1]);poly([iso(x+w,y,z),iso(x+w,y+d,z),iso(x+w,y+d,z+height),iso(x+w,y,z+height)],colors[2]);plane(x,y,w,d,z+height,colors[0]);}
function shadow(x,y,rx,ry,alpha=.2){const p=iso(x,y);ctx.fillStyle=`rgba(15,22,13,${alpha})`;ctx.beginPath();ctx.ellipse(p[0]+5,p[1]+1,rx,ry,0,0,Math.PI*2);ctx.fill();}
function text(t,x,y,size,color,align='left'){ctx.fillStyle=color;ctx.textAlign=align;ctx.font=`bold ${size}px "Microsoft JhengHei",sans-serif`;ctx.fillText(t,Math.round(x),Math.round(y));}
const objects=[];
function add(type,x,y,draw,offset=0){objects.push({type,x,y,depth:x+y+offset,draw});}

function ground(){
 rect(0,0,960,680,'#394431');
 // Dense, deterministic ground texture is drawn below all objects.
 for(let i=0;i<13000;i++){const x=rnd()*960,y=rnd()*680;rect(x,y,2+rnd()*4,1+rnd()*3,['#3d4933','#435139','#34402e','#49553a','#303c2c'][i%5]);}
 box(-.15,-.15,12.3,10.3,-14,14,['#65634c','#4a4735','#343a2b']);
 for(let y=0;y<10;y++)for(let x=0;x<12;x++){
  const isPath=(x>1&&x<11&&y>1&&y<9)||(x>=4&&x<=7&&y>=9);
  const c=isPath?['#858478','#929184','#8b8b7d','#99978a','#7e8174'][Math.floor(rnd()*5)]:['#536440','#5c6c43','#647248','#596a42'][Math.floor(rnd()*4)];
  plane(x+.018,y+.018,.964,.964,0,c);
  if(isPath){line([iso(x+.03,y+.97,1),iso(x+.03,y+.03,1),iso(x+.97,y+.03,1)],'#aeac9b');line([iso(x+.97,y+.03),iso(x+.97,y+.97),iso(x+.03,y+.97)],'#62685d',2);}
  for(let j=0;j<21;j++){const p=iso(x+.1+rnd()*.8,y+.1+rnd()*.8);rect(p[0],p[1],1+rnd()*3,1,isPath?(j%3?'#a39f8c66':'#555f5155'):(j%2?'#84935b88':'#3b513b88'));}
 }
 // A continuous painted gathering boundary, on the same ground plane.
 const a=3.25,b=4.3,w=5.8,d=3.6;
 plane(a,b,w,.09,1,'#d2b654');plane(a,b+d,w,.09,1,'#c5a448');plane(a,b,.1,d,1,'#ddbd5d');plane(a+w,b,.1,d+.09,1,'#d0ae4c');
 for(const [x,y] of [[4.6,5.5],[6.5,5.5],[4.6,7.05],[6.5,7.05]]){plane(x-.22,y,.44,.035,1,'#e2ce85');}
}
function wallBlock(x,y,w,d,z,h){
 box(x,y,w,d,z,h,['#aaa999','#777b72','#626b63']);
 const a=iso(x,y+d,z+h),b=iso(x+w,y+d,z+h),c=iso(x+w,y+d,z);
 line([a,b,c],'#424b45',2);line([[a[0]+2,a[1]+2],[b[0]-2,b[1]+2]],'#b2b1a0',2);
 for(let i=0;i<5;i++){const t=rnd(),p=iso(x+t*w,y+d,z+4+rnd()*(h-7));rect(p[0],p[1],3+rnd()*6,2,'#92948866');}
}
function walls(){
 for(let row=0;row<4;row++)for(let i=0;i<12;i++){const x=i+(row%2)*.5;const ww=Math.min(1,12-x);wallBlock(x,0,ww-.035,.38,row*17,16);}
 for(let x=0;x<12;x++)box(x-.02,-.05,.98,.5,68,7,['#bab8a6','#898d7e','#6c7569']);
 for(let y=.4;y<7.5;y+=1){for(let row=0;row<3;row++){box(0,y,.34,.97,row*17,16,['#9c9e8e','#707969','#596655']);line([iso(.34,y,row*17+16),iso(.34,y+.97,row*17+16)],'#a8ab98');}box(-.05,y-.02,.46,1,51,7,['#aaa997','#7b8471','#5e6b59']);}
}
function post(x,y,h=36){box(x,y,.15,.15,0,h,['#a88b55','#82633d','#554833']);box(x-.025,y-.025,.2,.2,h,3,['#c2a36b','#8c7044','#6b5636']);}
function fence(x,y,length,axis='x'){
 for(let n=0;n<length;n+=.04){const a=axis==='x'?[x+n,y]:[x,y+n];for(const z of [13,30])box(a[0],a[1],axis==='x'?.05:.1,axis==='x'?.1:.05,z,5,['#ac8a52','#846338','#5d4c30']);}
 for(let i=0;i<=length;i++)post(x+(axis==='x'?i:0),y+(axis==='y'?i:0));
}
function bush(x,y,scale=1){
 shadow(x,y,18*scale,7*scale);const p=iso(x,y);const colors=['#2d452f','#3e5835','#526b3b','#6e8148','#859453'];
 for(let i=0;i<45;i++){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd());const bx=p[0]+Math.cos(a)*r*23*scale,by=p[1]-8*scale+Math.sin(a)*r*12*scale;rect(bx,by,5*scale,4*scale,colors[Math.floor(rnd()*5)]);}
}
function tree(x,y,size=1){
 const p=iso(x,y);shadow(x,y,39*size,16*size,.28);ctx.save();ctx.translate(p[0],p[1]);ctx.scale(size,size);
 rect(-5,-54,11,55,'#392f24');rect(-3,-53,4,51,'#775b34');rect(1,-44,3,43,'#4d3e29');
 for(let k=0;k<4;k++){const yy=-31-k*23,ww=43-k*7;poly([[-ww,yy],[-ww+8,yy-9],[-ww+3,yy-9],[-ww+14,yy-21],[-ww+10,yy-21],[0,yy-51],[ww-9,yy-20],[ww-13,yy-20],[ww-3,yy-9],[ww-8,yy-9],[ww,yy],[17,yy+7],[-16,yy+5]],'#263f30');poly([[-ww+5,yy-2],[-ww+16,yy-20],[0,yy-47],[8,yy-20],[-5,yy-14],[8,yy-5],[-15,yy+2]],'#45613b');poly([[-ww+12,yy-4],[-ww+23,yy-21],[0,yy-44],[-4,yy-24],[-13,yy-10]],'#607645');for(let j=0;j<18;j++){const px=(rnd()-.5)*ww,py=yy-rnd()*24;rect(px,py,4,3,j%2?'#526f42':'#304e33');}}
 ctx.restore();
}
function board(x,y){
 shadow(x+.9,y,48,12);const p=iso(x,y);ctx.save();ctx.translate(p[0],p[1]);
 // Vertical plane faces southwest, shares the ground's 2:1 slope.
 ctx.transform(1,-.5,0,1,0,0);
 rect(-4,-116,9,119,'#3d3325');rect(-2,-115,5,117,'#a27a42');rect(126,-116,9,119,'#3d3325');rect(128,-114,5,117,'#a27a42');
 rect(-8,-121,148,91,'#362d22');rect(-5,-118,142,85,'#ae8750');rect(1,-112,130,72,'#293b32');rect(4,-109,124,66,'#35473a');
 line([[3,-110],[129,-110]],'#172c25',2);rect(-6,-121,146,3,'#d0ac69');rect(0,-37,132,4,'#755631');
 text('安全規定區',66,-91,17,'#f2e4b7','center');rect(12,-84,108,1,'#9eac7a');
 const rows=['聽從指示','依序集合','確認裝備'];rows.forEach((t,i)=>{rect(14,-77+i*11,6,6,'#cbb975');text(t,27,-71+i*11,9,'#e2dfbd');});
 for(const xx of [-1,130])for(const yy of [-115,-36]){rect(xx,yy,3,3,'#dec58c');rect(xx+1,yy+1,1,1,'#625644');}
 ctx.restore();
}
function earmuff(px,py){line([[px-7,py],[px-7,py-8],[px-3,py-12],[px+4,py-12],[px+8,py-8],[px+8,py]],'#202823',4);rect(px-9,py-3,5,10,'#242720');rect(px-8,py-2,3,7,'#d5ae44');rect(px+5,py-2,5,10,'#202720');rect(px+6,py-1,3,7,'#c89a36');}
function table(x,y){
 plane(x+.1,y+.15,2.9,1.05,0,'#3c463877');for(const xx of [x+.12,x+2.45])for(const yy of [y+.09,y+.77])box(xx,yy,.15,.15,0,32,['#a4804b','#795c35','#50432d']);
 box(x-.08,y-.08,2.9,1.12,32,5,['#b18a50','#7c5b33','#54432c']);
 for(let i=0;i<5;i++)line([iso(x,y+i*.21,38),iso(x+2.7,y+i*.21,38)],i%2?'#c29c60':'#8e6c3e');
 let p=iso(x+.5,y+.55,39);earmuff(p[0],p[1]);p=iso(x+1.15,y+.55,39);earmuff(p[0],p[1]);
 plane(x+1.65,y+.18,.48,.55,39,'#4a4a39');plane(x+1.69,y+.22,.4,.46,40,'#d8d6b9');for(let i=0;i<4;i++)line([iso(x+1.73,y+.28+i*.08,41),iso(x+2.02,y+.28+i*.08,41)],'#8c9583');
 box(x+2.23,y+.22,.52,.58,38,15,['#7a8560','#48583f','#344333']);box(x+2.2,y+.19,.58,.64,53,3,['#89916d','#56634a','#415039']);for(const yy of [y+.28,y+.65]){const pp=iso(x+2.76,yy,48);rect(pp[0],pp[1],2,5,'#c0b386');}
}
function bench(x,y){for(const xx of [x+.15,x+2.2])box(xx,y+.12,.18,.35,0,15,['#987346','#755532','#4f412e']);box(x,y,2.55,.58,15,5,['#aa824c','#7d5c34','#59472d']);line([iso(x,y+.29,21),iso(x+2.55,y+.29,21)],'#775b34');}
function cone(x,y){const p=iso(x,y);shadow(x,y,12,5);poly([[p[0]-13,p[1]-1],[p[0],p[1]-7],[p[0]+13,p[1]-1],[p[0],p[1]+6]],'#302c22');poly([[p[0]-10,p[1]-3],[p[0],p[1]-8],[p[0]+10,p[1]-3],[p[0],p[1]+3]],'#bb652f');poly([[p[0]-7,p[1]-5],[p[0]-2,p[1]-29],[p[0]+2,p[1]-30],[p[0]+7,p[1]-5],[p[0],p[1]]],'#db813b');poly([[p[0]+1,p[1]-28],[p[0]+3,p[1]-23],[p[0]+7,p[1]-5],[p[0],p[1]]],'#9e4b29');poly([[p[0]-4,p[1]-18],[p[0]+4,p[1]-18],[p[0]+5,p[1]-12],[p[0]-5,p[1]-12]],'#d5d2b5');}

// Small hand-built pixel sprites: each body part has its own outline and shading.
function person(x,y,{instructor=false,variant=0,ring=false}={}){
 const p=iso(x,y);shadow(x,y,17,7,.34);
 if(ring){ctx.strokeStyle='#57bdd5';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p[0],p[1]-1,17,7,0,0,Math.PI*2);ctx.stroke();}
 ctx.save();ctx.translate(p[0]-21,p[1]-71);ctx.scale(2.3,2.3);
 const R=rect,ink='#24281f',boot='#343127',olive='#637147',light='#82905a',shade='#414e35',skin='#c49462',hi='#e2b880';
 R(4,22,5,8,ink);R(10,22,5,8,ink);R(5,22,3,6,shade);R(11,22,3,6,olive);R(3,28,6,3,ink);R(10,28,6,3,ink);R(4,28,4,2,boot);R(11,28,4,2,'#514735');R(4,28,3,1,'#74654a');
 R(4,13,11,12,ink);R(5,13,9,10,olive);R(5,14,3,8,light);R(12,15,2,8,shade);R(5,22,9,2,'#333a29');R(8,22,2,1,'#b09b61');
 R(2,15,3,8,ink);R(3,15,2,5,olive);R(3,21,2,3,skin);R(3,21,1,2,hi);
 if(instructor){R(-3,14,8,3,ink);R(-5,13,5,3,skin);R(-7,13,3,1,hi);R(0,14,4,2,light);R(14,15,3,8,ink);R(14,16,2,4,olive);R(13,21,3,3,hi);R(9,17,5,5,'#202b28');R(10,17,3,4,'#bdbb9c');}
 else{R(14,15,3,8,ink);R(14,16,2,5,olive);R(14,21,2,3,skin);R(5,14,7,9,'#333c2b');R(6,15,5,7,'#67714b');R(6,16,4,2,'#92936a');R(7,20,4,3,'#4c563a');R(5,14,1,9,'#a39b66');}
 R(3,3,12,10,ink);R(2,5,14,6,ink);R(4,4,10,9,skin);R(5,4,8,7,hi);R(13,8,3,3,skin);R(14,8,1,2,hi);R(5,12,7,2,ink);R(7,12,4,2,skin);
 if(instructor){R(3,2,12,6,ink);R(5,0,8,3,ink);R(4,3,10,4,olive);R(6,1,6,3,light);R(2,7,13,2,'#343d2b');R(1,7,8,1,'#9a9e69');R(8,3,2,2,'#d1bc76');R(6,9,1,2,ink);R(11,9,1,2,ink);R(8,12,3,1,'#89613f');}
 else{
 const hair=variant===2?'#51402d':variant===1?'#695032':'#775437';const hl=variant===2?'#756044':'#966e40';
 R(3,2,11,6,ink);R(2,4,14,5,ink);R(4,1,4,3,ink);R(8,0,3,4,ink);R(11,2,4,3,ink);
 R(4,3,10,5,hair);R(3,5,12,4,hair);R(5,2,3,3,hl);R(8,2,3,4,hair);R(5,4,7,2,hl);R(4,7,9,3,hair);R(4,9,7,3,hair);R(3,9,3,2,ink);R(12,8,2,2,hair);R(13,10,1,1,ink);
 if(variant===2){R(2,8,4,9,ink);R(2,9,3,7,hair);R(3,8,2,2,'#c4aa6b');R(1,13,3,4,hair);}
 }
 ctx.restore();
}
function setup(){
 objects.length=0;
 add('board',2,1.55,()=>board(2,1.55),1.5);
 add('equipment',8.05,2.3,()=>table(8.05,2.3),1.9);
 add('equipment',8.15,3.8,()=>bench(8.15,3.8),1.4);
 add('people',6.25,3.1,()=>person(6.25,3.1,{instructor:true,ring:true}));
 [[4.65,5.5,0],[6.55,5.5,1],[4.65,7.05,2],[6.55,7.05,0]].forEach(([x,y,v],i)=>add('people',x,y,()=>person(x,y,{variant:v,ring:i===2})));
 add('greenery',10.95,.95,()=>tree(10.95,.95,1.12));add('greenery',.9,1.4,()=>tree(.9,1.4,.9));
 for(const [x,y,s] of [[1,5.8,.85],[1,8.4,.9],[10.8,6.8,.9],[10.9,8.5,1.15],[9.3,9.4,.8],[3,1, .6]])add('greenery',x,y,()=>bush(x,y,s));
 add('fixed',3.8,9.3,()=>cone(3.8,9.3));add('fixed',7.9,9.3,()=>cone(7.9,9.3));
 add('fixed',8.5,9.8,()=>fence(8.5,9.8,3),1.5);add('fixed',.5,9.8,()=>fence(.5,9.8,2),1);
 objects.sort((a,b)=>a.depth-b.depth);
}
function draw(){seed=716;ctx.clearRect(0,0,960,680);ground();walls();objects.forEach((o,i)=>{seed=716+i*173;if(layers[o.type]!==false)o.draw();});
 // Corner plaque is separate from the world and uses crisp readable text.
 rect(29,28,207,51,'#1c2924dd');rect(29,28,3,51,'#cfb56c');text('行前說明',47,51,15,'#eee4c2');text('集合後，聽取教官說明。',47,69,10,'#aebaa2');
 text('安全規定區',920,643,12,'#c4cbb0','right');text('FIELD ORIENTATION / 01',920,660,9,'#8b9b7e','right');
}
setup();draw();
document.querySelectorAll('[data-layer]').forEach(el=>el.addEventListener('change',()=>{layers[el.dataset.layer]=el.checked;draw();}));
document.getElementById('save').addEventListener('click',()=>{const a=document.createElement('a');a.download='安全規定區-2.5D場景.png';a.href=canvas.toDataURL('image/png');a.click();});
</script>
</body></html>
