const items=[...assets.records.slice(1),{depth:player.x+player.y,player:true}].sort((a,b)=>a.depth-b.depth);
for(const obj of items){if(!obj.player){c.drawImage(obj.image,obj.left,obj.top);continue}const p=P(player.x,player.y);shadow(player.x,player.y,22,10);c.strokeStyle='#7fb9ab';c.lineWidth=2;c.beginPath();c.ellipse(...p,17,7,0,0,Math.PI*2);c.stroke();const frame=player.moving?1+(Math.floor(player.step/Math.PI)%2):0;const sprite=assets.chars[player.dir*3+frame];c.drawImage(sprite.image,p[0]-sprite.anchorX,p[1]-sprite.anchorY);}}
function update(dt){let vx=0,vy=0;const right=keys.has('ArrowRight')||keys.has('d'),left=keys.has('ArrowLeft')||keys.has('a'),up=keys.has('ArrowUp')||keys.has('w'),down=keys.has('ArrowDown')||keys.has('s');const h=Number(right)-Number(left),v=Number(down)-Number(up);if(h||v){vx=h+v;vy=-h+v;waypoints=[];destination=null}else if(waypoints.length){const target=waypoints[0];vx=target.x-player.x;vy=target.y-player.y;const distance=Math.hypot(vx,vy);if(distance<.045){player.x=target.x;player.y=target.y;waypoints.shift();vx=vy=0;}}
 const len=Math.hypot(vx,vy);player.moving=false;if(len>.001){const amount=Math.min(2.2*dt,waypoints.length?len:Infinity),dx=vx/len*amount,dy=vy/len*amount;const oldx=player.x,oldy=player.y;if(canWalk(player.x+dx,player.y))player.x+=dx;if(canWalk(player.x,player.y+dy))player.y+=dy;player.moving=Math.hypot(player.x-oldx,player.y-oldy)>.001;if(player.moving){player.step+=dt*10;player.face=vx+vy<-.05?'back':'front';player.dir=(Math.round(Math.atan2(-vx,vy)/(Math.PI/4))+8)%8}}if(!waypoints.length)destination=null;
 const close=player.x>1.3&&player.x<4.9&&player.y>1.6&&player.y<3.4;if(close!==near){near=close;document.getElementById('note').hidden=!close;document.getElementById('status').textContent=close?'已抵達安全規定告示牌。':'探索這一小片庭院。';}}
function frame(time){const dt=Math.min((time-lastTime)/1000,.04);lastTime=time;update(dt);draw();requestAnimationFrame(frame)}
function clearInput(){keys.clear();player.moving=false}
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(k)){e.preventDefault();keys.add(k)}});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});
canvas.addEventListener('pointerdown',e=>{canvas.focus();const r=canvas.getBoundingClientRect();const end=unproject((e.clientX-r.left)*SW/r.width,(e.clientY-r.top)*SH/r.height);const path=route(player,end);if(path.length){waypoints=path;destination=end;document.getElementById('status').textContent='前往指定位置…'}else{document.getElementById('status').textContent='請點選庭院中可行走的地面。'}});
document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(b.dataset.key))});
document.getElementById('reset').addEventListener('click',()=>{Object.assign(player,{x:5.1,y:6.8,face:'front',dir:7,step:0,moving:false});waypoints=[];destination=null;clearInput();update(0);canvas.focus();document.getElementById('status').textContent='已回到入口。'});
Promise.all([...assets.records,...assets.chars].map(asset=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{asset.image=image;resolve()};image.onerror=()=>reject(new Error('素材載入失敗'));image.src=asset.src;}))).then(()=>{ready=true;document.getElementById('status').textContent='探索這一小片庭院。';draw();requestAnimationFrame(frame)}).catch(()=>{document.getElementById('status').textContent='素材未能載入，請重新開啟此檔案。'});
</script></body></html>
