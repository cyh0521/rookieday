<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>綠蔭裡的見習時光｜手繪風分檔版</title>
<link rel="stylesheet" href="style.css"></head><body><main>
<figure><canvas id="scene" width="1100" height="740" tabindex="0" aria-label="可移動的手繪等角庭院。使用方向鍵或 WASD 移動，也可點選地面前往。"></canvas><section id="npcDialogue" class="npc-dialogue" role="dialog" aria-modal="true" aria-labelledby="dialogueSpeaker" aria-describedby="dialogueText" hidden>
<div class="dialogue-portrait" aria-hidden="true"><img src="images/characters/npc-dialogue-portrait.png" alt=""></div>

<button id="dialogueContinue" class="dialogue-next" aria-label="結束對話，返回場景">▶</button>
</section></figure>
<span id="status" class="sr-only" role="status" aria-live="polite"></span></main>
<script src="assets.js"></script>
<script src="game.js"></script></body></html>
